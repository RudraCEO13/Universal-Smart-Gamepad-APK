name: Auto Setup and Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Auto Arrange Folders
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/universalsmartgamepad/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
        [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/universalsmartgamepad/app/
        [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
        [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
        [ -f index.html ] && mv index.html app/src/main/assets/
        [ -f build.gradle ] && cp build.gradle app/

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Universal-Smart-Gamepad-APK
        path: app/build/outputs/apk/debug/*.apk
